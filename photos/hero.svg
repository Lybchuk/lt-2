<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0c2447"/>
      <stop offset="0.45" stop-color="#1d5a9e"/>
      <stop offset="0.78" stop-color="#f2a93c"/>
      <stop offset="1" stop-color="#ffd27a"/>
    </linearGradient>
    <radialGradient id="sun" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ffe08a"/>
      <stop offset="0.7" stop-color="#fdb515"/>
      <stop offset="1" stop-color="#fdb515" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="sea" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2a82c8"/>
      <stop offset="1" stop-color="#0c2447"/>
    </linearGradient>
  </defs>

  <rect width="1600" height="900" fill="url(#sky)"/>

  <!-- сонце -->
  <circle cx="1060" cy="430" r="300" fill="url(#sun)" opacity="0.55"/>
  <circle cx="1060" cy="440" r="165" fill="#fdb515"/>

  <!-- дальні гори -->
  <polygon fill="#3f77b3" opacity="0.85"
    points="640,640 900,400 1000,470 1180,300 1370,480 1480,410 1600,500 1600,660 640,660"/>
  <!-- сніг на дальніх горах -->
  <polygon fill="#eaf2ff" opacity="0.9"
    points="1180,300 1135,360 1165,350 1185,380 1210,352 1245,372 1225,335"/>
  <polygon fill="#eaf2ff" opacity="0.9"
    points="900,400 865,440 892,432 912,456 935,432 960,444 932,418"/>

  <!-- ближні гори -->
  <polygon fill="#0f2d57"
    points="820,660 1130,440 1250,540 1420,360 1600,570 1600,680 820,680"/>
  <polygon fill="#eaf2ff"
    points="1420,360 1368,425 1402,414 1426,446 1452,412 1490,432 1462,392"/>
  <polygon fill="#eaf2ff"
    points="1130,440 1092,486 1118,478 1138,502 1160,476 1186,488 1160,462"/>

  <!-- море -->
  <rect y="640" width="1600" height="260" fill="url(#sea)"/>

  <!-- відблиск сонця на воді -->
  <g fill="#ffd27a" opacity="0.55">
    <rect x="980" y="662" width="160" height="6" rx="3"/>
    <rect x="1010" y="684" width="110" height="6" rx="3"/>
    <rect x="1030" y="706" width="70" height="6" rx="3"/>
  </g>

  <!-- хвилі -->
  <g fill="none" stroke="#eaf2ff" stroke-width="5" stroke-linecap="round" opacity="0.5">
    <path d="M0 740 q60 -34 120 0 t120 0 t120 0 t120 0 t120 0 t120 0 t120 0 t120 0 t120 0 t120 0 t120 0 t120 0 t120 0 t120 0"/>
    <path d="M-60 800 q60 -34 120 0 t120 0 t120 0 t120 0 t120 0 t120 0 t120 0 t120 0 t120 0 t120 0 t120 0 t120 0 t120 0 t120 0" opacity="0.7"/>
    <path d="M-30 860 q60 -34 120 0 t120 0 t120 0 t120 0 t120 0 t120 0 t120 0 t120 0 t120 0 t120 0 t120 0 t120 0 t120 0 t120 0" opacity="0.5"/>
  </g>
</svg>
